<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f0e14" />
    <meta
      name="description"
      content="Upload a Markdown file and see how it looks in HTML. Runs entirely in your browser."
    />
    <title>M2H — Markdown to HTML</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before first paint so a remembered light theme does not flash dark.
      try {
        var stored = localStorage.getItem('m2h.theme');
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
