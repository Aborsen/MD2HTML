# Copy this into .github/workflows/ of any repository that keeps documentation in Markdown.
#
# On every pull request it converts the Markdown that pull request touched, publishes each one as a
# shareable page, and leaves the links in a comment — so a reviewer reads the rendered document
# instead of a diff of asterisks.
name: Markdown preview

on:
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The action compares against the base commit, which has to be in the checkout.
          fetch-depth: 0

      - uses: Aborsen/MD2HTML@main
        with:
          api-key: ${{ secrets.TP_API_KEY }}
