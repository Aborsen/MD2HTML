<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    The caret from the wordmark, on its own. At sixteen pixels a word is a smudge and a letter is
    ambiguous, but this shape survives: one stroke, high contrast, and the same character the name
    is built around.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D8E97"/>
      <stop offset="100%" stop-color="#14A8AF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <path
    d="M12.5 9.5 21 16l-8.5 6.5"
    fill="none"
    stroke="#062023"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
